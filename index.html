<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Picture Book</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8vh;
      background-image: url('splashscreen.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #loading-indicator {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(45, 90, 45, 0.25);
      border-top-color: #2d5a2d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #start-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: min(70vw, 300px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #start-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    #start-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    #start-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    #read-me-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-top: 16px;
      width: min(70vw, 300px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease 0.15s;
    }
    #read-me-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    #read-me-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    #read-me-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    #guide-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #guide-overlay.visible {
      display: flex;
    }
    #guide-modal {
      background: #fdf8f0;
      border-radius: 18px;
      border: 2px solid #5a8a3a;
      max-width: 420px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 24px 24px;
      position: relative;
      font-family: 'Georgia', serif;
    }
    #guide-modal h2 {
      font-size: 20px;
      color: #2d5a1a;
      margin-bottom: 14px;
      text-align: center;
      font-weight: normal;
      letter-spacing: 0.02em;
    }
    #guide-modal p {
      font-size: 14px;
      color: #3a3a2a;
      line-height: 1.75;
      margin-bottom: 12px;
    }
    #guide-modal .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #2d5a1a;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 18px 0 6px;
    }
    #guide-modal ul {
      padding-left: 18px;
      margin-bottom: 12px;
    }
    #guide-modal li {
      font-size: 14px;
      color: #3a3a2a;
      line-height: 1.7;
      margin-bottom: 6px;
    }
    #guide-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: #5a8a3a;
      line-height: 1;
      padding: 2px 6px;
    }
    #guide-close:active { opacity: 0.6; }
    .guide-divider {
      border: none;
      border-top: 1px solid #c8d8b0;
      margin: 14px 0;
    }

    #scan-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: none;
      pointer-events: none;
      width: min(72vw, 340px);
    }
    #scan-hint img { width: 100%; height: auto; display: block; }

    #scan-frame {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
      border-color: rgba(200, 230, 192, 0.8);
      border-style: solid;
    }
    .corner-tl { top: 20%; left: 10%; border-width: 3px 0 0 3px; }
    .corner-tr { top: 20%; right: 10%; border-width: 3px 3px 0 0; }
    .corner-bl { bottom: 20%; left: 10%; border-width: 0 0 3px 3px; }
    .corner-br { bottom: 20%; right: 10%; border-width: 0 3px 3px 0; }

    #sound-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      right: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #sound-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #sound-btn:active { transform: scale(0.9); opacity: 0.8; }

    #flute-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #flute-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #flute-btn:active { transform: scale(0.9); opacity: 0.8; }

    #flute-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      align-items: center;
      justify-content: center;
    }
    #flute-overlay.visible { display: flex; }

    #flute-ui-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flute-ui-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    #flute-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #blow-instruction {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 860;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #blow-instruction p {
      font-family: 'Georgia', serif;
      font-size: 17px;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.7);
      line-height: 1.5;
    }
    #blow-instruction.hidden { opacity: 0; }

    #blow-progress {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 860;
      width: 56px;
      height: 56px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    #blow-progress.active { opacity: 1; }
    #blow-progress svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    #blow-progress circle.track {
      fill: none;
      stroke: rgba(255,255,255,0.2);
      stroke-width: 4;
    }
    #blow-progress circle.fill {
      fill: none;
      stroke: #ffd700;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 138.2;
      stroke-dashoffset: 138.2;
      transition: stroke-dashoffset 0.1s linear;
    }

    .hole-tap {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      z-index: 850;
      background: transparent;
      pointer-events: none;
      transition: box-shadow 0.15s ease, background 0.15s ease;
    }
    .hole-tap.lit {
      background: rgba(255, 220, 0, 0.45);
      box-shadow: 0 0 22px 10px rgba(255, 220, 0, 0.75);
      animation: holePulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes holePulse {
      from { box-shadow: 0 0 18px 8px rgba(255, 220, 0, 0.6); }
      to   { box-shadow: 0 0 30px 14px rgba(255, 220, 0, 0.9); }
    }

    #tune-matched {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #tune-matched.visible { display: flex; }
    #tune-matched img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Dotara button (mirrors flute-btn) ───────────────────── */
    #dotara-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #dotara-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #dotara-btn:active { transform: scale(0.9); opacity: 0.8; }

    /* ── Dotara overlay ───────────────────────────────────────
       Same 2D full-screen overlay approach as the flute: your
       idle illustration is the visible background, and thin
       invisible string-sway strips sit on top listening for
       horizontal swipes. Replace dotara-idle.png with your art —
       positions of .dotara-string below will need to line up
       with where the strings actually sit in that illustration. */
    #dotara-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      align-items: center;
      justify-content: center;
    }
    #dotara-overlay.visible { display: flex; }

    #dotara-ui-container {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
    }

    /* The artwork and the strings share one box with the artwork's own
       3:5 shape (1200 x 2000), so the strings stay glued to the painting
       on every screen size. */
    #dotara-stage {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 0.6));
      width: min(100vw, calc(100dvh * 0.6));
      aspect-ratio: 3 / 5;
      background-image: url('dotara-idle.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      z-index: 840;
    }

    #dotara-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #swipe-instruction {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 860;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #swipe-instruction p {
      font-family: 'Georgia', serif;
      font-size: 17px;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.7);
      line-height: 1.5;
    }
    #swipe-instruction.hidden { opacity: 0; }

    /* Pattern indicator dots — shows the L/R sequence to match */
    #pattern-row, #manjira-pattern-row, #dugdugi-pattern-row {
      position: absolute;
      top: 16%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 860;
      display: flex;
      gap: 8px;
      pointer-events: none;
    }
    .pattern-step {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      background: rgba(0,0,0,0.35);
      border: 2px solid rgba(255,255,255,0.5);
      color: rgba(255,255,255,0.7);
      transition: all 0.25s ease;
    }
    .pattern-step.done {
      background: #ffd700;
      border-color: #ffd700;
      color: #2d2000;
      transform: scale(1.08);
    }
    .pattern-step.next {
      border-color: #ffd700;
      color: #ffd700;
      animation: patternPulse 1.2s infinite ease-in-out;
    }
    @keyframes patternPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(255,215,0,0); }
    }

    /* Strings are drawn as an SVG path each, so a pluck can bow the
       MIDDLE while both ends stay pinned in place — like a real
       string fixed at the neck and the tailpiece — rather than
       rotating the whole line like a rigid rod. The whole group is
       tilted slightly to match the illustration's left lean.
       Positions/curve math are handled in JS (DOTARA_STRING_CONFIG);
       this just styles the drawn line itself. Strings are visible at
       rest (straight) the whole time the overlay is open — only the
       bow shape animates on a swipe, opacity never toggles. */
    #dotara-strings-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .dotara-string-path {
      fill: none;
      stroke: url(#dotara-string-grad);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 1;
      visibility: visible;
    }
    /* Faint mirror image drawn while a string vibrates, so it reads as
       a blur of motion like a real plucked string. */
    .dotara-ghost-path {
      fill: none;
      stroke: #5e442c;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.28;
    }
    @media (prefers-reduced-motion: reduce) {
      .dotara-string-path { transition: none; }
    }

    #dotara-matched {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #dotara-matched.visible { display: flex; }
    #dotara-matched img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  
    /* ── Manjira (fear spread) ── */
    #manjira-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #manjira-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
    #manjira-btn:active { transform: scale(0.9); opacity: 0.8; }
    #manjira-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      touch-action: manipulation;
    }
    #manjira-overlay.visible { display: block; }
    #manjira-canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 0.6));
      width: min(100vw, calc(100dvh * 0.6));
      aspect-ratio: 3 / 5;
    }
    #manjira-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    #manjira-matched {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #manjira-matched.visible { display: flex; }
    #manjira-matched img { width: 100%; height: 100%; object-fit: contain; }
    /* ---- dugdugi ---- */
    #dugdugi-pattern-row { gap: 5px; flex-wrap: wrap; justify-content: center; width: min(92vw, 330px); }
    #dugdugi-pattern-row .pattern-step { width: 25px; height: 25px; font-size: 0.85rem; }
    #dugdugi-btn {
      display: none; position: fixed; bottom: 28px; left: 20px; z-index: 600;
      width: 64px; height: 64px; padding: 0; border: none; background: none; cursor: pointer;
    }
    #dugdugi-btn img { width: 100%; height: 100%; object-fit: contain; display: block; }
    #dugdugi-btn:active { transform: scale(0.94); }
    #dugdugi-overlay { display: none; position: fixed; inset: 0; z-index: 800; touch-action: manipulation; }
    #dugdugi-overlay.visible { display: block; }
    #dugdugi-canvas {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 0.6)); width: min(100vw, calc(100dvh * 0.6)); aspect-ratio: 3 / 5;
    }
    #dugdugi-close {
      position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%;
      border: none; background: rgba(0,0,0,0.45); color: #fff; font-size: 1.3rem; cursor: pointer;
    }
    #dugdugi-matched { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; }
    #dugdugi-matched.visible { display: flex; }
    #dugdugi-matched img { width: 100%; height: 100%; object-fit: contain; }
</style>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="splash-screen">
    <button id="start-btn" aria-label="Let's Begin">
      <img src="let_s-begin.png" alt="Let's Begin" />
    </button>
    <button id="read-me-btn" aria-label="Read the caregiver guide">
      <img src="read-me-button.png" alt="Read Me" />
    </button>
    <div id="loading-indicator">
      <div class="spinner"></div>
    </div>
  </div>

  <div id="guide-overlay">
    <div id="guide-modal" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <button id="guide-close" aria-label="Close guide">✕</button>
      <h2 id="guide-title">A Guide for Caregivers</h2>
    </div>
  </div>

  <div id="scan-hint"><img src="pointcamera.png" alt="Point camera at the book page" /></div>

  <button id="sound-btn" aria-label="Toggle sound">
    <img id="sound-icon" src="sound-off.png" alt="Sound off" />
  </button>

  <button id="flute-btn" aria-label="Open flute">
    <img src="flute-button.png" alt="Play the flute" />
  </button>

  <button id="dotara-btn" aria-label="Open dotara">
    <img src="dotara-button.png" alt="Play the dotara" />
  </button>

  <button id="manjira-btn" aria-label="Open manjira">
    <!-- Placeholder button art: swap src for your own manjira-button.png when it is drawn -->
    <img src="manjira-left.png" alt="Play the manjira" />
  </button>

  <div id="scan-frame">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </div>

  <div id="flute-overlay">
    <div id="flute-ui-container">
      <img id="flute-ui-img" src="flute-ui.png" alt="Flute UI" />

      <div class="hole-tap" id="hole-1" data-hole="1"></div>
      <div class="hole-tap" id="hole-2" data-hole="2"></div>
      <div class="hole-tap" id="hole-3" data-hole="3"></div>
      <div class="hole-tap" id="hole-4" data-hole="4"></div>
      <div class="hole-tap" id="hole-5" data-hole="5"></div>
      <div class="hole-tap" id="hole-6" data-hole="6"></div>

      <div id="blow-instruction">
        <p>Take a deep breath...<br/>and blow!</p>
      </div>

      <div id="blow-progress">
        <svg viewBox="0 0 48 48">
          <circle class="track" cx="24" cy="24" r="22"/>
          <circle class="fill" id="progress-ring" cx="24" cy="24" r="22"/>
        </svg>
      </div>

      <button id="flute-close" aria-label="Close flute">✕</button>
    </div>
  </div>

  <div id="tune-matched">
    <img src="flute-complete.png" alt="Tune Matched!" />
  </div>

  <div id="dotara-overlay">
    <div id="dotara-ui-container">
      <div id="pattern-row"></div>

<div id="dotara-stage">
        <svg id="dotara-strings-svg" viewBox="0 0 1200 2000" preserveAspectRatio="none">
          <defs>
            <linearGradient id="dotara-string-grad" gradientUnits="userSpaceOnUse" x1="0" y1="424" x2="0" y2="1915">
              <stop offset="0.027" stop-color="#684a2f"/>
              <stop offset="0.094" stop-color="#5b422b"/>
              <stop offset="0.161" stop-color="#5f452d"/>
              <stop offset="0.228" stop-color="#5e442c"/>
              <stop offset="0.295" stop-color="#5d432b"/>
              <stop offset="0.362" stop-color="#5a412a"/>
              <stop offset="0.429" stop-color="#543d28"/>
              <stop offset="0.496" stop-color="#5c432c"/>
              <stop offset="0.563" stop-color="#8d683b"/>
              <stop offset="0.630" stop-color="#8f693b"/>
              <stop offset="0.698" stop-color="#936f43"/>
              <stop offset="0.765" stop-color="#98754b"/>
              <stop offset="0.832" stop-color="#9e7a4d"/>
              <stop offset="0.899" stop-color="#9c784a"/>
              <stop offset="0.966" stop-color="#926d43"/>
            </linearGradient>
          </defs>
          <path class="dotara-string-path" id="dstring-1"></path>
          <path class="dotara-string-path" id="dstring-2"></path>
          <path class="dotara-string-path" id="dstring-3"></path>
          <path class="dotara-string-path" id="dstring-4"></path>
        </svg>
      </div>

      <div id="swipe-instruction">
        <p>Swipe across the strings...<br/>left, then right!</p>
      </div>

      <button id="dotara-close" aria-label="Close dotara">✕</button>
    </div>
  </div>

  <div id="manjira-overlay">
    <div id="manjira-pattern-row"></div>
    <canvas id="manjira-canvas" role="img" aria-label="Two manjira cymbals joined by a red cord. Shake the phone left and right to clap them together."></canvas>
    <button id="manjira-close" aria-label="Close manjira">✕</button>
  </div>

  <div id="dotara-matched">
    <img src="dotara-complete.png" alt="Melody Matched!" />
  </div>

  <button id="dugdugi-btn" aria-label="Open the dugdugi drum"><img src="dugdugi.png" alt="" /></button>

  <div id="dugdugi-overlay">
    <div id="dugdugi-pattern-row"></div>
    <canvas id="dugdugi-canvas" role="img" aria-label="A dugdugi drum with two bead strings. Tilt the phone forward and back to swing the beads against the drum."></canvas>
    <button id="dugdugi-close" aria-label="Close dugdugi">&#10005;</button>
  </div>

  <div id="dugdugi-matched">
    <img src="dugdugi-complete.png" alt="Rhythm Matched!" onerror="this.style.display='none'" />
  </div>

  <div id="manjira-matched">
    <img src="manjira-complete.png" alt="Rhythm Matched!" onerror="this.style.display='none'" />
  </div>

  <!-- Ambient audio only — flute music is played via Web Audio API decoded buffer -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 3; missTolerance: 20; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="ar-video"
        src="animation.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>
      <audio id="ambient-audio" src="ambient.mp3" preload="auto" loop></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: flute / this spread's page -->
    <a-entity id="target-0" mindar-image-target="targetIndex: 0">
      <a-video
        src="#ar-video"
        position="0 0 0.001"
        width="1"
        height="0.8"
        rotation="0 0 0"
      ></a-video>
    </a-entity>

    <!-- Target 1: dotara / happiness spread's page.
         No AR overlay yet — no animation has been made for this spread,
         so this entity is left empty on purpose: the camera just shows
         the printed page itself (no black box) until targetFound fires
         and the dotara-btn appears. Add an <a-video> or <a-image> here
         once a dotara animation exists. -->
    <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>

    <!-- Target 2: manjira / fear spread's page. Empty on purpose (no AR overlay),
         the manjira-btn appears when this page is found. -->
    <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>

    <!-- Target 3: dugdugi / anger spread's page. Empty on purpose (no AR overlay),
         the dugdugi-btn appears when this page is found. -->
    <a-entity id="target-3" mindar-image-target="targetIndex: 3"></a-entity>
  </a-scene>

  <script>
    const splashScreen    = document.getElementById('splash-screen');
    const startBtn        = document.getElementById('start-btn');
    const readMeBtn       = document.getElementById('read-me-btn');
    const guideOverlay    = document.getElementById('guide-overlay');
    const guideClose      = document.getElementById('guide-close');
    const loadingInd      = document.getElementById('loading-indicator');
    const scanHint        = document.getElementById('scan-hint');
    const scanFrame       = document.getElementById('scan-frame');
    const arScene         = document.getElementById('ar-scene');
    const arVideo         = document.getElementById('ar-video');
    const ambientAudio    = document.getElementById('ambient-audio');
    const soundBtn        = document.getElementById('sound-btn');
    const soundIcon       = document.getElementById('sound-icon');
    const fluteBtn        = document.getElementById('flute-btn');
    const fluteOverlay    = document.getElementById('flute-overlay');
    const fluteClose      = document.getElementById('flute-close');
    const tuneMatched     = document.getElementById('tune-matched');
    const holeTaps        = document.querySelectorAll('.hole-tap');
    const blowInstruction = document.getElementById('blow-instruction');
    const blowProgress    = document.getElementById('blow-progress');
    const progressRing    = document.getElementById('progress-ring');

    const target0          = document.getElementById('target-0');
    const target1          = document.getElementById('target-1');

    const dotaraBtn         = document.getElementById('dotara-btn');
    const dotaraOverlay     = document.getElementById('dotara-overlay');
    const dotaraUiContainer = document.getElementById('dotara-ui-container');
    const dotaraClose       = document.getElementById('dotara-close');
    const dotaraMatched     = document.getElementById('dotara-matched');
    const swipeInstruction  = document.getElementById('swipe-instruction');
    const patternRow        = document.getElementById('pattern-row');

    // ── Splash / AR ready ─────────────────────────────────────
    function onReady() {
      loadingInd.style.display = 'none';
      startBtn.classList.add('ready');
      readMeBtn.classList.add('ready');
    }
    arScene.addEventListener('loaded', onReady);
    setTimeout(() => { if (!startBtn.classList.contains('ready')) onReady(); }, 5000);

    startBtn.addEventListener('click', () => {
      splashScreen.style.display = 'none';
      scanHint.style.display     = 'block';
      scanFrame.style.display    = 'flex';
      try { arScene.systems['mindar-image-system'].start(); }
      catch(e) { console.error('AR start error:', e); }
    });

    // ── Caregiver guide ───────────────────────────────────────
    readMeBtn.addEventListener('click', () => guideOverlay.classList.add('visible'));
    guideClose.addEventListener('click', () => guideOverlay.classList.remove('visible'));
    guideOverlay.addEventListener('click', (e) => {
      if (e.target === guideOverlay) guideOverlay.classList.remove('visible');
    });

    // ── Sound toggle (ambient only — completely separate from flute) ──
    let soundEnabled = false;
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        ambientAudio.play().catch(() => {});
        soundIcon.src = 'sound-on.png';
        soundIcon.alt = 'Sound on';
      } else {
        ambientAudio.pause();
        soundIcon.src = 'sound-off.png';
        soundIcon.alt = 'Sound off';
      }
    });

    // ── AR target events ──────────────────────────────────────
    // Scoped per-entity (not globally on arScene) so each spread's
    // button only appears when THAT spread's target is the one found —
    // pointing the camera at the dotara page can never trigger the
    // flute button, and vice versa.
    target0.addEventListener('targetFound', () => {
      scanHint.style.display  = 'none';
      scanFrame.style.display = 'none';
      soundBtn.style.display  = 'block';
      fluteBtn.style.display  = 'block';
      arVideo.play().catch(() => {});
      if (soundEnabled) ambientAudio.play().catch(() => {});
    });

    target0.addEventListener('targetLost', () => {
      scanHint.style.display  = 'block';
      scanFrame.style.display = 'flex';
      fluteBtn.style.display  = 'none';
      soundBtn.style.display  = 'none';
      arVideo.pause();
      ambientAudio.pause();
      // Note: soundEnabled flag stays as-is so it resumes correctly on next targetFound
    });

    target1.addEventListener('targetFound', () => {
      scanHint.style.display  = 'none';
      scanFrame.style.display = 'none';
      dotaraBtn.style.display = 'block';
      // Intentionally NOT showing soundBtn or playing ambientAudio here —
      // that track belongs to the flute scene only. Once a dotara-specific
      // background sound exists, add its own <audio> asset + a dedicated
      // dotaraAmbientAudio variable, and wire it in here the same way
      // ambientAudio is wired into target0's handlers above.
    });

    target1.addEventListener('targetLost', () => {
      scanHint.style.display  = 'block';
      scanFrame.style.display = 'flex';
      dotaraBtn.style.display = 'none';
      // If the dotara overlay happens to be open when the page is lost,
      // close it and stop listening for swipes.
      if (dotaraOverlay.classList.contains('visible')) {
        dotaraOverlay.classList.remove('visible');
        stopDotaraSwipeListening();
      }
    });

    // ── Hole positioning ──────────────────────────────────────
    const holePositions = [
      { top: 0.31, left: 0.50 },
      { top: 0.38, left: 0.50 },
      { top: 0.46, left: 0.50 },
      { top: 0.53, left: 0.50 },
      { top: 0.61, left: 0.50 },
      { top: 0.69, left: 0.50 },
    ];

    function positionHoles() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      holeTaps.forEach((el, i) => {
        const pos = holePositions[i];
        el.style.left = (pos.left * W - 26) + 'px';
        el.style.top  = (pos.top  * H - 26) + 'px';
      });
    }
    window.addEventListener('resize', () => {
      if (fluteOverlay.classList.contains('visible')) positionHoles();
    });

    // ── Dedicated Web Audio context for flute music ───────────
    // Completely isolated from the mic/analyser context so the
    // sound-toggle button can never interfere with playback.
    let fluteMusicCtx      = null;
    let fluteMusicBuffer   = null;
    let fluteMusicSource   = null;
    let fluteMusicLoaded   = false;

    async function loadFluteMusic() {
      try {
        const response = await fetch('flute.mp3');
        const arrayBuffer = await response.arrayBuffer();
        fluteMusicCtx = new (window.AudioContext || window.webkitAudioContext)();
        fluteMusicBuffer = await fluteMusicCtx.decodeAudioData(arrayBuffer);
        fluteMusicLoaded = true;
      } catch (e) {
        console.warn('Flute music preload failed:', e);
      }
    }
    // Preload immediately on page load
    loadFluteMusic();

    function playFluteMusic() {
      if (!fluteMusicLoaded || !fluteMusicBuffer) {
        // Fallback: try HTML audio as last resort
        const fallback = new Audio('flute.mp3');
        fallback.play().catch(() => {});
        setTimeout(() => {
          fallback.pause();
          dismissComplete();
        }, 8000);
        return;
      }

      // Create a fresh context if the previous one was closed
      if (!fluteMusicCtx || fluteMusicCtx.state === 'closed') {
        fluteMusicCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (fluteMusicCtx.state === 'suspended') {
        fluteMusicCtx.resume();
      }

      // Stop any previous source cleanly
      if (fluteMusicSource) {
        try { fluteMusicSource.stop(); } catch(e) {}
        fluteMusicSource = null;
      }

      fluteMusicSource = fluteMusicCtx.createBufferSource();
      fluteMusicSource.buffer = fluteMusicBuffer;
      fluteMusicSource.connect(fluteMusicCtx.destination);
      fluteMusicSource.start(0);

      // Auto-dismiss when track ends
      fluteMusicSource.onended = () => dismissComplete();
    }

    function stopFluteMusic() {
      if (fluteMusicSource) {
        try { fluteMusicSource.stop(); } catch(e) {}
        fluteMusicSource = null;
      }
    }

    // ── Flute open / close ────────────────────────────────────
    fluteBtn.addEventListener('click', () => {
      // Unlock the mic AudioContext on user gesture
      const unlockCtx = getMicAudioCtx();
      if (unlockCtx.state === 'suspended') unlockCtx.resume();
      // Also unlock the music context on this same gesture
      if (fluteMusicCtx && fluteMusicCtx.state === 'suspended') {
        fluteMusicCtx.resume();
      }
      positionHoles();
      fluteOverlay.classList.add('visible');
      resetBlow();
      startListening();
    });

    fluteClose.addEventListener('click', () => {
      fluteOverlay.classList.remove('visible');
      stopListening();
      resetBlow();
    });

    // ── Blow detection ────────────────────────────────────────
    // Tuned for sensitivity:
    //   BLOW_THRESHOLD   — RMS to register as a blow (lowered for better response)
    //   BLOW_NOISE_FLOOR — below this is silence; resets only on true quiet
    //   Gap between the two prevents brief breath dips from resetting the ring
    //   smoothingTimeConstant raised so the meter stays smooth during normal breath
    const BLOW_THRESHOLD    = 0.018;   // was 0.035 — more sensitive now
    const BLOW_NOISE_FLOOR  = 0.007;   // was 0.012 — only true silence resets
    const BLOW_DURATION_MS  = 2000;
    const RING_CIRCUMFERENCE = 138.2;

    let micAudioCtx   = null;
    let analyser      = null;
    let micStream     = null;
    let animFrame     = null;
    let blowStartTime = null;
    let isBlowing     = false;
    let completed     = false;

    function getMicAudioCtx() {
      if (!micAudioCtx || micAudioCtx.state === 'closed') {
        micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return micAudioCtx;
    }

    async function startListening() {
      completed = false;
      try {
        const ctx = getMicAudioCtx();
        if (ctx.state === 'suspended') await ctx.resume();

        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const source = ctx.createMediaStreamSource(micStream);

        analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        // Higher smoothing = meter doesn't jitter on normal breath variations
        analyser.smoothingTimeConstant = 0.85;
        source.connect(analyser);

        listenLoop();
      } catch(e) {
        console.warn('Mic not available:', e);
      }
    }

    function stopListening() {
      if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      analyser = null;
      blowStartTime = null;
      isBlowing = false;
    }

    function listenLoop() {
      if (!analyser || completed) return;
      animFrame = requestAnimationFrame(listenLoop);

      const dataArray = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(dataArray);
      let rms = 0;
      for (let i = 0; i < dataArray.length; i++) rms += dataArray[i] * dataArray[i];
      rms = Math.sqrt(rms / dataArray.length);

      const blowing = rms > BLOW_THRESHOLD;
      const now = performance.now();

      if (blowing) {
        if (!isBlowing) {
          isBlowing = true;
          blowStartTime = now;
          lightHoles(true);
          blowInstruction.classList.add('hidden');
          blowProgress.classList.add('active');
        }

        const elapsed = now - blowStartTime;
        const fraction = Math.min(elapsed / BLOW_DURATION_MS, 1);
        progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - fraction);

        if (elapsed >= BLOW_DURATION_MS) {
          completed = true;
          stopListening();
          onBlowComplete();
        }

      } else if (rms < BLOW_NOISE_FLOOR) {
        // Only reset on actual silence — brief mid-breath dips won't undo progress
        if (isBlowing) {
          isBlowing = false;
          blowStartTime = null;
          lightHoles(false);
          blowInstruction.classList.remove('hidden');
          blowProgress.classList.remove('active');
          progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
        }
      }
      // RMS between BLOW_NOISE_FLOOR and BLOW_THRESHOLD = ambient noise / soft breath
      // → do nothing; let existing state hold
    }

    function lightHoles(on) {
      holeTaps.forEach(h => {
        if (on) h.classList.add('lit');
        else h.classList.remove('lit');
      });
    }

    function resetBlow() {
      completed = false;
      isBlowing = false;
      blowStartTime = null;
      lightHoles(false);
      blowInstruction.classList.remove('hidden');
      blowProgress.classList.remove('active');
      progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
    }

    // ── Blow complete → show completion screen + play flute music ──
    let dismissTimer = null;

    function onBlowComplete() {
      lightHoles(false);
      fluteOverlay.classList.remove('visible');

      tuneMatched.classList.add('visible');
      playFluteMusic();

      // Safety fallback dismiss after 8 seconds
      if (dismissTimer) clearTimeout(dismissTimer);
      dismissTimer = setTimeout(dismissComplete, 8000);
    }

    function dismissComplete() {
      if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
      stopFluteMusic();
      tuneMatched.classList.remove('visible');
      resetBlow();
    }

    // ══════════════════════════════════════════════════════════
    // DOTARA — swipe-pattern interaction (Happiness spread)
    // ══════════════════════════════════════════════════════════

    // ── Swipe pluck sound: Karplus-Strong string synthesis ──
    // A raw oscillator (what was here before) always sounds electronic —
    // real plucked strings have noisy, complex overtones that decay
    // unevenly. Karplus-Strong is the classic physical-modeling algorithm
    // used to synthesize exactly that: a short noise burst is fed through
    // a decaying feedback loop shaped like a vibrating string, which
    // produces a genuinely string-like pluck instead of a beep.
    let dotaraSfxCtx = null;
    const PLUCK_FREQ_LEFT  = 196.00; // G3
    const PLUCK_FREQ_RIGHT = 293.66; // D4

    function createPluckBuffer(ctx, frequency, durationSec) {
      const sampleRate = ctx.sampleRate;
      const bufferSize = Math.floor(sampleRate * durationSec);
      const buffer = ctx.createBuffer(1, bufferSize, sampleRate);
      const data = buffer.getChannelData(0);

      const period = Math.round(sampleRate / frequency);
      const damping = 0.994; // closer to 1 = longer sustain; lower = shorter/duller pluck

      // The initial "pick" — tapered noise burst, not a harsh click
      for (let i = 0; i < period; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / period);
      }
      // Karplus-Strong feedback loop: each sample is a damped average of
      // two samples one period back. This averaging IS what produces the
      // string-like timbre — it's a simple physical model of a vibrating
      // string losing energy to friction over time.
      for (let i = period; i < bufferSize; i++) {
        data[i] = damping * 0.5 * (data[i - period] + data[i - period + 1]);
      }
      return buffer;
    }

    function playStringPluck(direction) {
      if (!dotaraSfxCtx || dotaraSfxCtx.state === 'closed') {
        dotaraSfxCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (dotaraSfxCtx.state === 'suspended') dotaraSfxCtx.resume();

      const freq = direction === 'L' ? PLUCK_FREQ_LEFT : PLUCK_FREQ_RIGHT;
      const buffer = createPluckBuffer(dotaraSfxCtx, freq, 0.6);

      const source = dotaraSfxCtx.createBufferSource();
      source.buffer = buffer;

      // A gentle lowpass rounds off the noise burst's harsh edge so it
      // reads as a wooden string body rather than raw static
      const filter = dotaraSfxCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 3200;

      const gain = dotaraSfxCtx.createGain();
      const now = dotaraSfxCtx.currentTime;
      gain.gain.setValueAtTime(0.7, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

      source.connect(filter);
      filter.connect(gain);
      gain.connect(dotaraSfxCtx.destination);
      source.start(now);
    }

    // The directional sequence the child must swipe, in order.
    // A wrong swipe does NOT advance and does NOT reset — it's simply
    // ignored, and the child waits for the correct direction.
    const DOTARA_PATTERN = ['L', 'R', 'L', 'L'];
    const SWIPE_MIN_DISTANCE = 30;   // px
    const SWIPE_MAX_DURATION = 800;  // ms

    let dotaraStepIndex   = 0;
    let dotaraComplete    = false;
    let dotaraTouchStartX = 0;
    let dotaraTouchStartT = 0;
    let dotaraSwayIndex   = 0;

    // ── String geometry (pixels of the 1200 x 2000 artwork) ──
    // Measured from the painting: each string is a straight line from
    // (xTop, STRING_TOP_Y) to (xBottom, STRING_BOTTOM_Y). Both ends
    // stay pinned while the middle vibrates.
    const DOTARA_STRING_CONFIG = [
      { id: 'dstring-1', xTop: 546.5, xBottom: 562.7 },
      { id: 'dstring-2', xTop: 566.0, xBottom: 585.6 },
      { id: 'dstring-3', xTop: 595.8, xBottom: 610.4 },
      { id: 'dstring-4', xTop: 610.4, xBottom: 636.5 },
    ];
    const STRING_TOP_Y       = 424;
    const STRING_BOTTOM_Y    = 1915;
    const STRING_SEGMENTS    = 28;
    const STRING_MAX_BOW     = 9;    // widest swing, in artwork pixels
    const STRING_FREQ_1      = 11;   // Hz, main vibration
    const STRING_FREQ_2      = 17;   // Hz, small second wave
    const STRING_DURATION_MS = 900;

    function stringPath(cfg, disp) {
      let d = '';
      for (let i = 0; i <= STRING_SEGMENTS; i++) {
        const s = i / STRING_SEGMENTS;
        const x = cfg.xTop + (cfg.xBottom - cfg.xTop) * s + (disp ? disp(s) : 0);
        const y = STRING_TOP_Y + (STRING_BOTTOM_Y - STRING_TOP_Y) * s;
        d += (i ? ' L ' : 'M ') + x.toFixed(1) + ',' + y.toFixed(1);
      }
      return d;
    }

    DOTARA_STRING_CONFIG.forEach(cfg => {
      cfg.el = document.getElementById(cfg.id);
      cfg.ghost = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      cfg.ghost.setAttribute('class', 'dotara-ghost-path');
      cfg.el.parentNode.insertBefore(cfg.ghost, cfg.el);
      cfg.el.setAttribute('d', stringPath(cfg));
    });

    const dotaraStringAnimFrames = {}; // id -> requestAnimationFrame handle

    // A plucked string: starts at its widest, shivers quickly with a
    // small second wave on top, and settles back to straight.
    function animateStringVibrate(cfg, strength = 1) {
      if (dotaraStringAnimFrames[cfg.id]) cancelAnimationFrame(dotaraStringAnimFrames[cfg.id]);
      const start = performance.now();

      function frame(now) {
        const ms = now - start;
        if (ms >= STRING_DURATION_MS) {
          cfg.el.setAttribute('d', stringPath(cfg));
          cfg.ghost.setAttribute('d', '');
          delete dotaraStringAnimFrames[cfg.id];
          return;
        }
        const t = ms / 1000;
        const env = STRING_MAX_BOW * strength * Math.exp(-t * 4.5);
        const shape = s => env * (
          Math.sin(Math.PI * s) * Math.cos(2 * Math.PI * STRING_FREQ_1 * t) +
          0.3 * Math.sin(2 * Math.PI * s) * Math.cos(2 * Math.PI * STRING_FREQ_2 * t)
        );
        cfg.el.setAttribute('d', stringPath(cfg, shape));
        cfg.ghost.setAttribute('d', stringPath(cfg, s => -shape(s)));
        dotaraStringAnimFrames[cfg.id] = requestAnimationFrame(frame);
      }
      dotaraStringAnimFrames[cfg.id] = requestAnimationFrame(frame);
    }

    // Strings are drawn at page load and stay visible the whole time. This
    // just makes sure they are straight and complete each time the instrument opens.
    function resetDotaraStrings() {
      DOTARA_STRING_CONFIG.forEach(cfg => {
        if (dotaraStringAnimFrames[cfg.id]) { cancelAnimationFrame(dotaraStringAnimFrames[cfg.id]); delete dotaraStringAnimFrames[cfg.id]; }
        cfg.el.setAttribute('d', stringPath(cfg));
        cfg.ghost.setAttribute('d', '');
      });
    }

    // Every swipe sends a ripple across the strings, in the direction of
    // the finger. A faster swipe makes a bigger shiver.
    function rippleStrings(direction, speed) {
      const strength = Math.min(1.4, Math.max(0.7, 0.6 + speed * 0.5)); // speed in px/ms
      const order = direction === 'R' ? DOTARA_STRING_CONFIG : DOTARA_STRING_CONFIG.slice().reverse();
      order.forEach((cfg, i) => setTimeout(() => animateStringVibrate(cfg, strength), i * 55));
    }

    function renderPatternRow() {
      patternRow.innerHTML = '';
      DOTARA_PATTERN.forEach((dir, i) => {
        const el = document.createElement('div');
        el.className = 'pattern-step';
        el.textContent = dir === 'L' ? '←' : '→';
        if (i < dotaraStepIndex) el.classList.add('done');
        else if (i === dotaraStepIndex) el.classList.add('next');
        patternRow.appendChild(el);
      });
    }

    function swayNextString() {
      const cfg = DOTARA_STRING_CONFIG[dotaraSwayIndex % DOTARA_STRING_CONFIG.length];
      animateStringVibrate(cfg);
      dotaraSwayIndex++;
    }

    function swayAllStrings() {
      DOTARA_STRING_CONFIG.forEach((cfg, i) => {
        setTimeout(() => animateStringVibrate(cfg), i * 90);
      });
    }

    function resetDotaraSwipe() {
      dotaraStepIndex = 0;
      dotaraComplete = false;
      renderPatternRow();

    const TILT_DEG = 10;            // how far to tilt for one move (degrees)
    const MOVE_COOLDOWN_MS = 250;   // minimum time between moves
    const PATTERN = Array.from({ length: 10 }, (_, i) => (i % 2 === 0 ? 'F' : 'B'));   // F = tilt forward, B = tilt back
    const ARROW = { F: '\u2191', B: '\u2193' };
    const ROPE = 380;               // string length in picture pixels
    const SIDES = [
      { ax: 330, ay: 1030, cx: 238, rest: 35,  hit: 15 },      // left string
      { ax: 854, ay: 1030, cx: 953, rest: -35, hit: -18.4 }   // right string
    ];

    const btn = document.getElementById('dugdugi-btn');
    const overlay = document.getElementById('dugdugi-overlay');
    const cv = document.getElementById('dugdugi-canvas');
    const ctx = cv.getContext('2d');
    const closeBtn = document.getElementById('dugdugi-close');
    const row = document.getElementById('dugdugi-pattern-row');
    const matched = document.getElementById('dugdugi-matched');
    const imDrum = new Image(); imDrum.src = 'dugdugi.png';
    const imStr = new Image(); imStr.src = 'dugdugi-strings.png';

    const dpr = Math.min(2, window.devicePixelRatio || 1), SC = 0.5;
    cv.width = 600 * dpr; cv.height = 1000 * dpr;

    let ac = null, running = false, raf = 0, lastT = 0;
    let p = 0, v = 0, closing = false, lastDir = 'F';
    let ref = null, lastMove = 0, stepIndex = 0, complete = false, dismissTimer = null;

    function sound(dir) {
      try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        const t = ac.currentTime;
        const f0 = dir === 'F' ? 150 : 230, f1 = dir === 'F' ? 70 : 115;   // forward = low "dug", back = higher "dugi"
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + 0.18);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.9, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.4);
        const o2 = ac.createOscillator(), g2 = ac.createGain();   // small bead tap
        o2.type = 'triangle'; o2.frequency.value = 1700;
        g2.gain.setValueAtTime(0.18, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        o2.connect(g2); g2.connect(ac.destination); o2.start(t); o2.stop(t + 0.06);
      } catch (e) {}
    }

    function renderRow() {
      row.innerHTML = '';
      PATTERN.forEach((dir, i) => {
        const el = document.createElement('div');
        el.className = 'pattern-step';
        el.textContent = ARROW[dir];
        if (i < stepIndex) el.classList.add('done');
        else if (i === stepIndex) el.classList.add('next');
        row.appendChild(el);
      });
    }

    function draw() {
      if (!imDrum.complete || !imStr.complete || !imDrum.naturalWidth || !imStr.naturalWidth) return;
      ctx.setTransform(dpr * SC, 0, 0, dpr * SC, 0, 0);
      ctx.clearRect(0, 0, 1200, 2000);
      ctx.drawImage(imDrum, 0, 0);
      SIDES.forEach(s => {
        const th = (s.rest + (s.hit - s.rest) * p) * Math.PI / 180;
        ctx.save();
        ctx.translate(s.ax, s.ay);
        ctx.rotate(th);
        ctx.drawImage(imStr, s.cx - 50, 1517 - ROPE, 100, ROPE + 70, -50, 0, 100, ROPE + 70);
        ctx.restore();
      });
    }

    function tick(now) {
      if (!running) return;
      const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now;
      if (closing) {
        p = Math.min(1, p + dt * 11);
        if (p >= 1) { closing = false; v = -5.5; }
      } else {
        v += (-140 * p - 8 * v) * dt;
        p += v * dt;
        if (p < -0.25) { p = -0.25; v = 0; }
        if (Math.abs(p) < 0.001 && Math.abs(v) < 0.01) { p = 0; v = 0; }
      }
      draw();
      raf = requestAnimationFrame(tick);
    }

    function onMove(dir) {
      if (!running || complete || closing) return;
      lastDir = dir;
      sound(dir);                     // drum sound on every movement
      closing = true;                 // beads swing in and hit the drum on every tilt
      if (dir === PATTERN[stepIndex]) {
        stepIndex++;
        renderRow();
        if (stepIndex === PATTERN.length) {
          complete = true;
          setTimeout(showComplete, 1100);
        }
      }
      // Wrong direction: no penalty, wait for the right one.
    }

    function onTilt(e) {
      const b = e.beta;
      if (b == null) return;
      if (ref === null) { ref = b; return; }
      const d = b - ref, n = performance.now();
      if (Math.abs(d) > TILT_DEG && n - lastMove > MOVE_COOLDOWN_MS) {
        lastMove = n; ref = b;
        onMove(d > 0 ? 'F' : 'B');    // beta going up = top of phone tips away from you = forward
      } else {
        ref += d * 0.008;             // slowly follow how the phone is held
      }
    }

    function open() {
      overlay.classList.add('visible');
      p = 0; v = 0; closing = false; ref = null; lastMove = 0;
      stepIndex = 0; complete = false; renderRow();
      window.addEventListener('deviceorientation', onTilt);
      running = true; lastT = performance.now();
      raf = requestAnimationFrame(tick);
    }

    function close() {
      running = false;
      cancelAnimationFrame(raf);
      window.removeEventListener('deviceorientation', onTilt);
      overlay.classList.remove('visible');
    }

    function showComplete() {
      if (!running) return;
      close();
      matched.classList.add('visible');
      if (dismissTimer) clearTimeout(dismissTimer);
      dismissTimer = setTimeout(() => { matched.classList.remove('visible'); dismissTimer = null; }, 8000);
    }

    btn.addEventListener('click', () => {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
      if (ac && ac.state === 'suspended') ac.resume();
      const D = window.DeviceOrientationEvent;
      if (D && typeof D.requestPermission === 'function') {
        D.requestPermission().then(r => { if (r === 'granted') open(); }).catch(() => {});
      } else {
        open();
      }
    });
    closeBtn.addEventListener('click', close);

    const t3 = document.getElementById('target-3');
    const hint = document.getElementById('scan-hint');
    const frame = document.getElementById('scan-frame');
    if (t3) {
      t3.addEventListener('targetFound', () => {
        hint.style.display = 'none'; frame.style.display = 'none'; btn.style.display = 'block';
      });
      t3.addEventListener('targetLost', () => {
        btn.style.display = 'none';
        // the overlay stays open if the camera loses the page (tilting can lose it)
        if (!overlay.classList.contains('visible')) { hint.style.display = 'block'; frame.style.display = 'flex'; }
      });
    }
  })();
  </script>
</body>
</html>
