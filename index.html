<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Picture Book</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8vh;
      background-image: url('splashscreen.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #loading-indicator {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(45, 90, 45, 0.25);
      border-top-color: #2d5a2d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #start-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: min(70vw, 300px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #start-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    #start-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    #start-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    #scan-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: none;
      pointer-events: none;
      width: min(72vw, 340px);
    }
    #scan-hint img {
      width: 100%;
      height: auto;
      display: block;
    }

    #scan-frame {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
      border-color: rgba(200, 230, 192, 0.8);
      border-style: solid;
    }
    .corner-tl { top: 20%; left: 10%; border-width: 3px 0 0 3px; }
    .corner-tr { top: 20%; right: 10%; border-width: 3px 3px 0 0; }
    .corner-bl { bottom: 20%; left: 10%; border-width: 0 0 3px 3px; }
    .corner-br { bottom: 20%; right: 10%; border-width: 0 3px 3px 0; }

    #sound-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      right: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #sound-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #sound-btn:active {
      transform: scale(0.9);
      opacity: 0.8;
    }

    /* FLUTE BUTTON */
    #flute-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #flute-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #flute-btn:active {
      transform: scale(0.9);
      opacity: 0.8;
    }

    /* FLUTE UI OVERLAY */
    #flute-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      align-items: center;
      justify-content: center;
    }
    #flute-overlay.visible {
      display: flex;
    }

    #flute-ui-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flute-ui-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Close button */
    #flute-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Invisible tap zones for each hole */
    .hole-tap {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 850;
      background: transparent;
      transition: box-shadow 0.1s ease, background 0.1s ease;
    }
    .hole-tap.lit {
      background: rgba(255, 220, 0, 0.45);
      box-shadow: 0 0 18px 8px rgba(255, 220, 0, 0.7);
    }

    /* Tune Matched overlay */
    #tune-matched {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #tune-matched.visible {
      display: flex;
    }
    #tune-matched img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="splash-screen">
    <button id="start-btn" aria-label="Let's Begin">
      <img src="let_s-begin.png" alt="Let's Begin" />
    </button>
    <div id="loading-indicator">
      <div class="spinner"></div>
    </div>
  </div>

  <div id="scan-hint"><img src="pointcamera.png" alt="Point camera at the book page" /></div>

  <button id="sound-btn" aria-label="Toggle sound">
    <img id="sound-icon" src="sound-off.png" alt="Sound off" />
  </button>

  <!-- FLUTE BUTTON (bottom left) -->
  <button id="flute-btn" aria-label="Open flute">
    <img src="flute-button.png" alt="Play the flute" />
  </button>

  <div id="scan-frame">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </div>

  <!-- FLUTE UI OVERLAY -->
  <div id="flute-overlay">
    <div id="flute-ui-container">
      <img id="flute-ui-img" src="flute-ui.png" alt="Flute UI" />

      <!-- Invisible tap zones — positions tuned for the illustrated holes -->
      <div class="hole-tap" id="hole-1" data-hole="1"></div>
      <div class="hole-tap" id="hole-2" data-hole="2"></div>
      <div class="hole-tap" id="hole-3" data-hole="3"></div>
      <div class="hole-tap" id="hole-4" data-hole="4"></div>
      <div class="hole-tap" id="hole-5" data-hole="5"></div>
      <div class="hole-tap" id="hole-6" data-hole="6"></div>

      <button id="flute-close" aria-label="Close flute">✕</button>
    </div>
  </div>

  <!-- TUNE MATCHED OVERLAY -->
  <div id="tune-matched">
    <img src="flute-complete.png" alt="Tune Matched!" />
  </div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 3; missTolerance: 20; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="ar-video"
        src="animation.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>
      <audio id="ambient-audio" src="ambient.mp3" preload="auto" loop></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#ar-video"
        position="0 0 0.001"
        width="1"
        height="0.8"
        rotation="0 0 0"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    // ── DOM refs ──────────────────────────────────────────────
    const splashScreen  = document.getElementById('splash-screen');
    const startBtn      = document.getElementById('start-btn');
    const loadingInd    = document.getElementById('loading-indicator');
    const scanHint      = document.getElementById('scan-hint');
    const scanFrame     = document.getElementById('scan-frame');
    const arScene       = document.getElementById('ar-scene');
    const arVideo       = document.getElementById('ar-video');
    const ambientAudio  = document.getElementById('ambient-audio');
    const soundBtn      = document.getElementById('sound-btn');
    const soundIcon     = document.getElementById('sound-icon');
    const fluteBtn      = document.getElementById('flute-btn');
    const fluteOverlay  = document.getElementById('flute-overlay');
    const fluteClose    = document.getElementById('flute-close');
    const tuneMatched   = document.getElementById('tune-matched');
    const holeTaps      = document.querySelectorAll('.hole-tap');

    // ── Splash / AR ready ─────────────────────────────────────
    function onReady() {
      loadingInd.style.display = 'none';
      startBtn.classList.add('ready');
    }
    arScene.addEventListener('loaded', onReady);
    setTimeout(() => { if (!startBtn.classList.contains('ready')) onReady(); }, 5000);

    startBtn.addEventListener('click', () => {
      splashScreen.style.display = 'none';
      scanHint.style.display     = 'block';
      scanFrame.style.display    = 'flex';
      try { arScene.systems['mindar-image-system'].start(); }
      catch(e) { console.error('AR start error:', e); }
    });

    // ── Sound toggle ──────────────────────────────────────────
    let soundEnabled = false;
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        ambientAudio.play().catch(() => {});
        soundIcon.src = 'sound-on.png';
        soundIcon.alt = 'Sound on';
      } else {
        ambientAudio.pause();
        soundIcon.src = 'sound-off.png';
        soundIcon.alt = 'Sound off';
      }
    });

    // ── AR target events ──────────────────────────────────────
    arScene.addEventListener('targetFound', () => {
      scanHint.style.display  = 'none';
      scanFrame.style.display = 'none';
      soundBtn.style.display  = 'block';
      fluteBtn.style.display  = 'block';
      arVideo.play().catch(() => {});
      if (soundEnabled) ambientAudio.play().catch(() => {});
    });

    arScene.addEventListener('targetLost', () => {
      scanHint.style.display  = 'block';
      scanFrame.style.display = 'flex';
      fluteBtn.style.display  = 'none';
      fluteOverlay.classList.remove('visible');
      arVideo.pause();
      ambientAudio.pause();
    });

    // ── Flute UI open / close ─────────────────────────────────
    fluteBtn.addEventListener('click', () => {
      positionHoles();
      fluteOverlay.classList.add('visible');
      resetSequence();
    });

    fluteClose.addEventListener('click', () => {
      fluteOverlay.classList.remove('visible');
      resetSequence();
    });

    // ── Hole positioning ──────────────────────────────────────
    // UPDATED: shifted up (~0.03) and right (0.47 → 0.50) based on phone screenshots
    const holePositions = [
      { top: 0.31, left: 0.50 },  // hole 1
      { top: 0.38, left: 0.50 },  // hole 2
      { top: 0.46, left: 0.50 },  // hole 3
      { top: 0.53, left: 0.50 },  // hole 4
      { top: 0.61, left: 0.50 },  // hole 5
      { top: 0.69, left: 0.50 },  // hole 6
    ];

    function positionHoles() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      holeTaps.forEach((el, i) => {
        const pos = holePositions[i];
        el.style.left = (pos.left * W - 26) + 'px';
        el.style.top  = (pos.top  * H - 26) + 'px';
      });
    }
    window.addEventListener('resize', () => {
      if (fluteOverlay.classList.contains('visible')) positionHoles();
    });

   // ── Realistic banshi-style tone (Happiness version) ─────────────────────────────
// Uses a single airy flute sample + pitch shifting for 6 notes.
// No external MP3 needed — generates a natural, warm bansuri-like tone.

const baseFlute = new Audio();
baseFlute.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=";
// (This is a silent placeholder; replaced by generated tone below)

function playTone(holeIndex) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    // Happiness scale: major pentatonic (bright, joyful)
    const freqs = [523.25, 587.33, 659.25, 783.99, 880.00, 987.77]; // Sa Re Ga Pa Dha Ni (C major pentatonic)
    const freq = freqs[holeIndex];

    // MASTER
    const master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);

    // ── 1. Fundamental airy flute tone ───────────────────────────────
    const osc = ctx.createOscillator();
    osc.type = "triangle"; // warmer than sine
    osc.frequency.value = freq;

    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0, now);
    oscGain.gain.linearRampToValueAtTime(0.6, now + 0.05); // soft attack
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);

    osc.connect(oscGain);
    oscGain.connect(master);

    // ── 2. Breath noise (airy bansuri feel) ──────────────────────────
    const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 1.0, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * 0.4; // soft breath
    }

    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = "bandpass";
    noiseFilter.frequency.value = freq * 1.1;
    noiseFilter.Q.value = 1.5;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.25, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.05, now + 0.2);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(master);

    // ── 3. Gentle vibrato (joyful, lively) ───────────────────────────
    const vibrato = ctx.createOscillator();
    vibrato.frequency.value = 6; // faster vibrato = happy

    const vibratoGain = ctx.createGain();
    vibratoGain.gain.setValueAtTime(0, now);
    vibratoGain.gain.linearRampToValueAtTime(8, now + 0.2); // expressive vibrato

    vibrato.connect(vibratoGain);
    vibratoGain.connect(osc.frequency);

    // ── Start everything ─────────────────────────────────────────────
    osc.start(now);
    noise.start(now);
    vibrato.start(now);

    osc.stop(now + 1.0);
    noise.stop(now + 1.0);
    vibrato.stop(now + 1.0);

  } catch (e) {
    console.warn("Flute audio error:", e);
  }
}

    // ── Sequence logic ────────────────────────────────────────
    // Joy sequence: holes 1 3 5 3 1 5
    const TARGET_SEQUENCE = [1, 3, 5, 3, 1, 5];
    let currentSequence = [];

    function resetSequence() {
      currentSequence = [];
      holeTaps.forEach(h => h.classList.remove('lit'));
    }

    holeTaps.forEach(el => {
      el.addEventListener('click', () => {
        const holeNum = parseInt(el.dataset.hole);
        const holeIdx = holeNum - 1;

        // Light up
        el.classList.add('lit');
        setTimeout(() => el.classList.remove('lit'), 300);

        // Play tone
        playTone(holeIdx);

        // Record
        currentSequence.push(holeNum);

        // Check against target so far
        const so_far = TARGET_SEQUENCE.slice(0, currentSequence.length);
        const match  = currentSequence.every((v, i) => v === so_far[i]);

        if (!match) {
          currentSequence = [];
          return;
        }

        if (currentSequence.length === TARGET_SEQUENCE.length) {
          setTimeout(() => {
            fluteOverlay.classList.remove('visible');
            tuneMatched.classList.add('visible');
            setTimeout(() => {
              tuneMatched.classList.remove('visible');
              resetSequence();
            }, 2500);
          }, 400);
        }
      });
    });
  </script>
</body>
</html>
