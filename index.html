<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Picture Book</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8vh;
      background-image: url('splashscreen.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #loading-indicator {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(45, 90, 45, 0.25);
      border-top-color: #2d5a2d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #start-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: min(70vw, 300px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #start-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    #start-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    #start-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    /* READ ME BUTTON — appears below Let's Begin, same fade-in */
    #read-me-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-top: 16px;
      width: min(70vw, 300px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease 0.15s; /* slight delay after Let's Begin */
    }
    #read-me-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    #read-me-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    #read-me-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    /* CAREGIVER GUIDE MODAL */
    #guide-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #guide-overlay.visible {
      display: flex;
    }
    #guide-modal {
      background: #fdf8f0;
      border-radius: 18px;
      border: 2px solid #5a8a3a;
      max-width: 420px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 24px 24px;
      position: relative;
      font-family: 'Georgia', serif;
    }
    #guide-modal h2 {
      font-size: 20px;
      color: #2d5a1a;
      margin-bottom: 14px;
      text-align: center;
      font-weight: normal;
      letter-spacing: 0.02em;
    }
    #guide-modal p {
      font-size: 14px;
      color: #3a3a2a;
      line-height: 1.75;
      margin-bottom: 12px;
    }
    #guide-modal .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #2d5a1a;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 18px 0 6px;
    }
    #guide-modal ul {
      padding-left: 18px;
      margin-bottom: 12px;
    }
    #guide-modal li {
      font-size: 14px;
      color: #3a3a2a;
      line-height: 1.7;
      margin-bottom: 6px;
    }
    #guide-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: #5a8a3a;
      line-height: 1;
      padding: 2px 6px;
    }
    #guide-close:active {
      opacity: 0.6;
    }
    .guide-divider {
      border: none;
      border-top: 1px solid #c8d8b0;
      margin: 14px 0;
    }

    #scan-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: none;
      pointer-events: none;
      width: min(72vw, 340px);
    }
    #scan-hint img {
      width: 100%;
      height: auto;
      display: block;
    }

    #scan-frame {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
      border-color: rgba(200, 230, 192, 0.8);
      border-style: solid;
    }
    .corner-tl { top: 20%; left: 10%; border-width: 3px 0 0 3px; }
    .corner-tr { top: 20%; right: 10%; border-width: 3px 3px 0 0; }
    .corner-bl { bottom: 20%; left: 10%; border-width: 0 0 3px 3px; }
    .corner-br { bottom: 20%; right: 10%; border-width: 0 3px 3px 0; }

    #sound-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      right: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #sound-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #sound-btn:active {
      transform: scale(0.9);
      opacity: 0.8;
    }

    /* FLUTE BUTTON */
    #flute-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #flute-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #flute-btn:active {
      transform: scale(0.9);
      opacity: 0.8;
    }

    /* FLUTE UI OVERLAY */
    #flute-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      align-items: center;
      justify-content: center;
    }
    #flute-overlay.visible {
      display: flex;
    }

    #flute-ui-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flute-ui-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* Close button */
    #flute-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Invisible tap zones for each hole */
    .hole-tap {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 850;
      background: transparent;
      transition: box-shadow 0.1s ease, background 0.1s ease;
    }
    .hole-tap.lit {
      background: rgba(255, 220, 0, 0.45);
      box-shadow: 0 0 18px 8px rgba(255, 220, 0, 0.7);
    }

    /* Tune Matched overlay */
    #tune-matched {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #tune-matched.visible {
      display: flex;
    }
    #tune-matched img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="splash-screen">
    <button id="start-btn" aria-label="Let's Begin">
      <img src="let_s-begin.png" alt="Let's Begin" />
    </button>

    <!-- READ ME BUTTON — caregiver guide -->
    <button id="read-me-btn" aria-label="Read the caregiver guide">
      <img src="read-me-button.png" alt="Read Me" />
    </button>

    <div id="loading-indicator">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- CAREGIVER GUIDE MODAL -->
  <div id="guide-overlay">
    <div id="guide-modal" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <button id="guide-close" aria-label="Close guide">✕</button>
      <h2 id="guide-title">A Guide for Caregivers</h2>
    </div>
  </div>

  <div id="scan-hint"><img src="pointcamera.png" alt="Point camera at the book page" /></div>

  <button id="sound-btn" aria-label="Toggle sound">
    <img id="sound-icon" src="sound-off.png" alt="Sound off" />
  </button>

  <!-- FLUTE BUTTON (bottom left) -->
  <button id="flute-btn" aria-label="Open flute">
    <img src="flute-button.png" alt="Play the flute" />
  </button>

  <div id="scan-frame">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </div>

  <!-- FLUTE UI OVERLAY -->
  <div id="flute-overlay">
    <div id="flute-ui-container">
      <img id="flute-ui-img" src="flute-ui.png" alt="Flute UI" />

      <!-- Invisible tap zones — positions tuned for the illustrated holes -->
      <div class="hole-tap" id="hole-1" data-hole="1"></div>
      <div class="hole-tap" id="hole-2" data-hole="2"></div>
      <div class="hole-tap" id="hole-3" data-hole="3"></div>
      <div class="hole-tap" id="hole-4" data-hole="4"></div>
      <div class="hole-tap" id="hole-5" data-hole="5"></div>
      <div class="hole-tap" id="hole-6" data-hole="6"></div>

      <button id="flute-close" aria-label="Close flute">✕</button>
    </div>
  </div>

  <!-- TUNE MATCHED OVERLAY -->
  <div id="tune-matched">
    <img src="flute-complete.png" alt="Tune Matched!" />
  </div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 3; missTolerance: 20; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="ar-video"
        src="animation.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>
      <audio id="ambient-audio" src="ambient.mp3" preload="auto" loop></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#ar-video"
        position="0 0 0.001"
        width="1"
        height="0.8"
        rotation="0 0 0"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    // ── DOM refs ──────────────────────────────────────────────
    const splashScreen  = document.getElementById('splash-screen');
    const startBtn      = document.getElementById('start-btn');
    const readMeBtn     = document.getElementById('read-me-btn');
    const guideOverlay  = document.getElementById('guide-overlay');
    const guideClose    = document.getElementById('guide-close');
    const loadingInd    = document.getElementById('loading-indicator');
    const scanHint      = document.getElementById('scan-hint');
    const scanFrame     = document.getElementById('scan-frame');
    const arScene       = document.getElementById('ar-scene');
    const arVideo       = document.getElementById('ar-video');
    const ambientAudio  = document.getElementById('ambient-audio');
    const soundBtn      = document.getElementById('sound-btn');
    const soundIcon     = document.getElementById('sound-icon');
    const fluteBtn      = document.getElementById('flute-btn');
    const fluteOverlay  = document.getElementById('flute-overlay');
    const fluteClose    = document.getElementById('flute-close');
    const tuneMatched   = document.getElementById('tune-matched');
    const holeTaps      = document.querySelectorAll('.hole-tap');

    // ── Splash / AR ready ─────────────────────────────────────
    function onReady() {
      loadingInd.style.display = 'none';
      startBtn.classList.add('ready');
      readMeBtn.classList.add('ready');
    }
    arScene.addEventListener('loaded', onReady);
    setTimeout(() => { if (!startBtn.classList.contains('ready')) onReady(); }, 5000);

    startBtn.addEventListener('click', () => {
      splashScreen.style.display = 'none';
      scanHint.style.display     = 'block';
      scanFrame.style.display    = 'flex';
      try { arScene.systems['mindar-image-system'].start(); }
      catch(e) { console.error('AR start error:', e); }
    });

    // ── Caregiver guide modal ─────────────────────────────────
    readMeBtn.addEventListener('click', () => {
      guideOverlay.classList.add('visible');
    });
    guideClose.addEventListener('click', () => {
      guideOverlay.classList.remove('visible');
    });
    guideOverlay.addEventListener('click', (e) => {
      if (e.target === guideOverlay) guideOverlay.classList.remove('visible');
    });

    // ── Sound toggle ──────────────────────────────────────────
    let soundEnabled = false;
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        ambientAudio.play().catch(() => {});
        soundIcon.src = 'sound-on.png';
        soundIcon.alt = 'Sound on';
      } else {
        ambientAudio.pause();
        soundIcon.src = 'sound-off.png';
        soundIcon.alt = 'Sound off';
      }
    });

    // ── AR target events ──────────────────────────────────────
    arScene.addEventListener('targetFound', () => {
      scanHint.style.display  = 'none';
      scanFrame.style.display = 'none';
      soundBtn.style.display  = 'block';
      fluteBtn.style.display  = 'block';
      arVideo.play().catch(() => {});
      if (soundEnabled) ambientAudio.play().catch(() => {});
    });

    arScene.addEventListener('targetLost', () => {
      scanHint.style.display  = 'block';
      scanFrame.style.display = 'flex';
      fluteBtn.style.display  = 'none';
      fluteOverlay.classList.remove('visible');
      arVideo.pause();
      ambientAudio.pause();
    });

    // ── Flute UI open / close ─────────────────────────────────
    fluteBtn.addEventListener('click', () => {
      positionHoles();
      fluteOverlay.classList.add('visible');
      resetSequence();
    });

    fluteClose.addEventListener('click', () => {
      fluteOverlay.classList.remove('visible');
      resetSequence();
    });

    // ── Hole positioning ──────────────────────────────────────
    // UPDATED: shifted up (~0.03) and right (0.47 → 0.50) based on phone screenshots
    const holePositions = [
      { top: 0.31, left: 0.50 },  // hole 1
      { top: 0.38, left: 0.50 },  // hole 2
      { top: 0.46, left: 0.50 },  // hole 3
      { top: 0.53, left: 0.50 },  // hole 4
      { top: 0.61, left: 0.50 },  // hole 5
      { top: 0.69, left: 0.50 },  // hole 6
    ];

    function positionHoles() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      holeTaps.forEach((el, i) => {
        const pos = holePositions[i];
        el.style.left = (pos.left * W - 26) + 'px';
        el.style.top  = (pos.top  * H - 26) + 'px';
      });
    }
    window.addEventListener('resize', () => {
      if (fluteOverlay.classList.contains('visible')) positionHoles();
    });

    // ── Bāṁshi flute tone — mp3 source, pitch-shifted ────────────────────
    //
    // BANGLADESHI FOLK MUSIC FRAMEWORK
    // Each emotion sequence is grounded in Bangladeshi folk music tradition
    // and the natural calls of the emotion animals in Mon's story.
    //
    // Traditions referenced:
    //   Baul   — UNESCO Intangible Cultural Heritage of Bangladesh (2005).
    //            Mystic minstrel songs of rural Bengal; bāṁshi is a core
    //            instrument. Joy and spiritual delight expressed through
    //            short ascending phrases and bouncy repeated notes.
    //            (UNESCO ICH Register: RL/00107)
    //
    //   Bhatiyali — The river song of Bangladesh (eastern Bengal).
    //            Sung by boatmen going downstream; melancholy, soulful,
    //            characterised by long descending phrases. The river is
    //            a metaphor for life and longing.
    //            (Daily Star cultural archive; IJFMR 2025 folk music survey)
    //
    //   Jari/Sari — Processional and rhythmic group songs of Bangladesh.
    //            Sharp, repetitive, percussive patterns; used to express
    //            communal intensity, urgency, and strong emotion.
    //            (Bengali Folk Music Tradition, ResearchGate 2025)
    //
    // Animal call research:
    //   Bulbul (Joy) — Red-vented bulbul (Pycnonotus cafer), present in
    //            all 11 bulbul species recorded in Bangladesh (Banglapedia).
    //            Signature call transcribed as "tu-tu-tul" — a short rising
    //            3-note phrase that repeats. Songs composed of 2–6 elements,
    //            0.98–4.5 kHz range, discrete and stereotyped.
    //            (Bhatt & Kumar 2001, Journal of Biosciences; BirdBuddy Wiki)
    //
    // ── Hole → note mapping (Bengali folk pentatonic, natural intervals) ──
    //   Bengali folk music gravitates toward a pentatonic scale with natural
    //   (shuddha) intervals — the same tonal family used in Baul and Bhatiyali.
    //   Just intonation ratios preserve the authentic tonal character of the
    //   bāṁshi rather than equal-tempered approximations.
    //
    //   Hole 1 = Sa   ratio 1:1    (tonic / root)
    //   Hole 2 = Re   ratio 9:8    (major 2nd)
    //   Hole 3 = Ga   ratio 5:4    (major 3rd)
    //   Hole 4 = Pa   ratio 3:2    (perfect 5th)
    //   Hole 5 = Dha  ratio 5:3    (major 6th)
    //   Hole 6 = Sa'  ratio 2:1    (high octave)
    const playbackRates = [
      1.000,  // hole 1 — Sa  (tonic)
      1.125,  // hole 2 — Re  (9:8)
      1.250,  // hole 3 — Ga  (5:4)
      1.500,  // hole 4 — Pa  (3:2)
      1.667,  // hole 5 — Dha (5:3)
      2.000,  // hole 6 — Sa' (octave)
    ];

    const TRIM_START    = 1.0;   // skip breathy build-up, start at full tone
    const TRIM_DURATION = 0.85;  // snappy for a 10-note sequence

    let audioCtx    = null;
    let fluteBuffer = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    fetch('flute-note.mp3')
      .then(r => r.arrayBuffer())
      .then(buf => getAudioCtx().decodeAudioData(buf))
      .then(decoded => { fluteBuffer = decoded; })
      .catch(e => console.warn('Flute mp3 load error:', e));

    function playTone(holeIndex) {
      try {
        const ctx = getAudioCtx();
        if (!fluteBuffer) return;
        const rate = playbackRates[holeIndex];
        const now  = ctx.currentTime;
        const source = ctx.createBufferSource();
        source.buffer = fluteBuffer;
        source.playbackRate.value = rate;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.setValueAtTime(1.0, now + TRIM_DURATION - 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + TRIM_DURATION);
        source.connect(gain);
        gain.connect(ctx.destination);
        source.start(now, TRIM_START, TRIM_DURATION);
      } catch(e) { console.warn('Audio error:', e); }
    }

    // ── Sequence logic ──────────────────────────────────────────────────
    //
    // JOY (Bulbul bird) — Baul tradition + Bulbul call pattern
    //
    // The bulbul's signature call is "tu-tu-tul" — a short rising 3-note
    // phrase that repeats (Bhatt & Kumar 2001; BirdBuddy; Banglapedia).
    // In Baul folk tradition, joy is expressed through short ascending
    // phrases and bouncy, repeated middle notes (Baul Music, bauls.wordpress;
    // UNESCO ICH RL/00107).
    //
    // Sequence maps the "tu-tu-tul" call twice, then resolves upward:
    //   tu = Sa→Ga (quick skip up, like the bird's first chirp)
    //   tu = Ga repeat (the call doubles)
    //   tul = reach to Dha (the leap that makes it joyful)
    //   → then mirror back down and land on Ga (warm Baul resolution)
    //
    //   holes: 1  3  3  5  3  1  2  3  2  1
    //   notes: Sa Ga Ga Dha Ga Sa Re Ga Re Sa
    //
    // Short, bright, bouncy — a bird calling twice and landing.
    const TARGET_SEQUENCE = [1, 3, 3, 5, 3, 1, 2, 3, 2, 1];
    let currentSequence = [];

    function resetSequence() {
      currentSequence = [];
      holeTaps.forEach(h => h.classList.remove('lit'));
    }

    holeTaps.forEach(el => {
      el.addEventListener('click', () => {
        const holeNum = parseInt(el.dataset.hole);
        const holeIdx = holeNum - 1;

        el.classList.add('lit');
        setTimeout(() => el.classList.remove('lit'), 300);

        playTone(holeIdx);

        currentSequence.push(holeNum);

        const so_far = TARGET_SEQUENCE.slice(0, currentSequence.length);
        const match  = currentSequence.every((v, i) => v === so_far[i]);

        if (!match) {
          currentSequence = [];
          return;
        }

        if (currentSequence.length === TARGET_SEQUENCE.length) {
          setTimeout(() => {
            fluteOverlay.classList.remove('visible');
            tuneMatched.classList.add('visible');
            setTimeout(() => {
              tuneMatched.classList.remove('visible');
              resetSequence();
            }, 2500);
          }, 400);
        }
      });
    });
  </script>
</body>
</html>
