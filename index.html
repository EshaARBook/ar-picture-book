<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Picture Book</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Georgia', serif; }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8vh;
      background-image: url('splashscreen.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    #loading-indicator {
      position: absolute;
      bottom: 10vh;
      left: 50%;
      transform: translateX(-50%);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(45, 90, 45, 0.25);
      border-top-color: #2d5a2d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #start-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: min(70vw, 300px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #start-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    #start-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    #start-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    #read-me-btn {
      position: relative;
      z-index: 1;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-top: 16px;
      width: min(70vw, 300px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease 0.15s;
    }
    #read-me-btn.ready {
      opacity: 1;
      pointer-events: auto;
    }
    #read-me-btn img {
      width: 100%;
      height: auto;
      display: block;
    }
    #read-me-btn:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    #guide-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #guide-overlay.visible {
      display: flex;
    }
    #guide-modal {
      background: #fdf8f0;
      border-radius: 18px;
      border: 2px solid #5a8a3a;
      max-width: 420px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 24px 24px;
      position: relative;
      font-family: 'Georgia', serif;
    }
    #guide-modal h2 {
      font-size: 20px;
      color: #2d5a1a;
      margin-bottom: 14px;
      text-align: center;
      font-weight: normal;
      letter-spacing: 0.02em;
    }
    #guide-modal p {
      font-size: 14px;
      color: #3a3a2a;
      line-height: 1.75;
      margin-bottom: 12px;
    }
    #guide-modal .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #2d5a1a;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 18px 0 6px;
    }
    #guide-modal ul {
      padding-left: 18px;
      margin-bottom: 12px;
    }
    #guide-modal li {
      font-size: 14px;
      color: #3a3a2a;
      line-height: 1.7;
      margin-bottom: 6px;
    }
    #guide-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: #5a8a3a;
      line-height: 1;
      padding: 2px 6px;
    }
    #guide-close:active { opacity: 0.6; }
    .guide-divider {
      border: none;
      border-top: 1px solid #c8d8b0;
      margin: 14px 0;
    }

    #scan-hint {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: none;
      pointer-events: none;
      width: min(72vw, 340px);
    }
    #scan-hint img { width: 100%; height: auto; display: block; }

    #scan-frame {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 400;
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
      border-color: rgba(200, 230, 192, 0.8);
      border-style: solid;
    }
    .corner-tl { top: 20%; left: 10%; border-width: 3px 0 0 3px; }
    .corner-tr { top: 20%; right: 10%; border-width: 3px 3px 0 0; }
    .corner-bl { bottom: 20%; left: 10%; border-width: 0 0 3px 3px; }
    .corner-br { bottom: 20%; right: 10%; border-width: 0 3px 3px 0; }

    #sound-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      right: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #sound-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #sound-btn:active { transform: scale(0.9); opacity: 0.8; }

    /* FLUTE BUTTON */
    #flute-btn {
      display: none;
      position: fixed;
      bottom: 28px;
      left: 20px;
      z-index: 600;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      width: 64px;
      height: 64px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    #flute-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    #flute-btn:active { transform: scale(0.9); opacity: 0.8; }

    /* FLUTE UI OVERLAY */
    #flute-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 800;
      align-items: center;
      justify-content: center;
    }
    #flute-overlay.visible { display: flex; }

    #flute-ui-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flute-ui-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    #flute-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.35);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    /* Blow instruction text */
    #blow-instruction {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 860;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #blow-instruction p {
      font-family: 'Georgia', serif;
      font-size: 17px;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,0.7);
      line-height: 1.5;
    }
    #blow-instruction .blow-emoji {
      font-size: 28px;
      display: block;
      margin-bottom: 4px;
      animation: floatBreath 2s ease-in-out infinite;
    }
    @keyframes floatBreath {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    #blow-instruction.hidden { opacity: 0; }

    /* Blow progress ring */
    #blow-progress {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 860;
      width: 56px;
      height: 56px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    #blow-progress.active { opacity: 1; }
    #blow-progress svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    #blow-progress circle.track {
      fill: none;
      stroke: rgba(255,255,255,0.2);
      stroke-width: 4;
    }
    #blow-progress circle.fill {
      fill: none;
      stroke: #ffd700;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 138.2; /* 2π × 22 */
      stroke-dashoffset: 138.2;
      transition: stroke-dashoffset 0.1s linear;
    }

    /* Hole tap zones */
    .hole-tap {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      z-index: 850;
      background: transparent;
      pointer-events: none; /* blow model — no tapping */
      transition: box-shadow 0.15s ease, background 0.15s ease;
    }
    .hole-tap.lit {
      background: rgba(255, 220, 0, 0.45);
      box-shadow: 0 0 22px 10px rgba(255, 220, 0, 0.75);
      animation: holePulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes holePulse {
      from { box-shadow: 0 0 18px 8px rgba(255, 220, 0, 0.6); }
      to   { box-shadow: 0 0 30px 14px rgba(255, 220, 0, 0.9); }
    }

    /* Tune Matched overlay */
    #tune-matched {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #tune-matched.visible { display: flex; }
    #tune-matched img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div id="splash-screen">
    <button id="start-btn" aria-label="Let's Begin">
      <img src="let_s-begin.png" alt="Let's Begin" />
    </button>
    <button id="read-me-btn" aria-label="Read the caregiver guide">
      <img src="read-me-button.png" alt="Read Me" />
    </button>
    <div id="loading-indicator">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- CAREGIVER GUIDE MODAL -->
  <div id="guide-overlay">
    <div id="guide-modal" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <button id="guide-close" aria-label="Close guide">✕</button>
      <h2 id="guide-title">A Guide for Caregivers</h2>
    </div>
  </div>

  <div id="scan-hint"><img src="pointcamera.png" alt="Point camera at the book page" /></div>

  <button id="sound-btn" aria-label="Toggle sound">
    <img id="sound-icon" src="sound-off.png" alt="Sound off" />
  </button>

  <!-- FLUTE BUTTON (bottom left) -->
  <button id="flute-btn" aria-label="Open flute">
    <img src="flute-button.png" alt="Play the flute" />
  </button>

  <div id="scan-frame">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
  </div>

  <!-- FLUTE UI OVERLAY -->
  <div id="flute-overlay">
    <div id="flute-ui-container">
      <img id="flute-ui-img" src="flute-ui.png" alt="Flute UI" />

      <!-- Hole tap zones (visual only in blow model) -->
      <div class="hole-tap" id="hole-1" data-hole="1"></div>
      <div class="hole-tap" id="hole-2" data-hole="2"></div>
      <div class="hole-tap" id="hole-3" data-hole="3"></div>
      <div class="hole-tap" id="hole-4" data-hole="4"></div>
      <div class="hole-tap" id="hole-5" data-hole="5"></div>
      <div class="hole-tap" id="hole-6" data-hole="6"></div>

      <!-- Blow instruction — second person, child-friendly -->
      <div id="blow-instruction">
        <span class="blow-emoji">🎋</span>
        <p>Take a deep breath...<br/>and blow!</p>
      </div>

      <!-- Circular progress ring shown while blowing -->
      <div id="blow-progress">
        <svg viewBox="0 0 48 48">
          <circle class="track" cx="24" cy="24" r="22"/>
          <circle class="fill" id="progress-ring" cx="24" cy="24" r="22"/>
        </svg>
      </div>

      <button id="flute-close" aria-label="Close flute">✕</button>
    </div>
  </div>

  <!-- TUNE MATCHED OVERLAY -->
  <div id="tune-matched">
    <img src="flute-complete.png" alt="Tune Matched!" />
  </div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 3; missTolerance: 20; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="ar-video"
        src="animation.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>
      <audio id="ambient-audio" src="ambient.mp3" preload="auto" loop></audio>
      <audio id="flute-music" src="flute.mp3" preload="auto"></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#ar-video"
        position="0 0 0.001"
        width="1"
        height="0.8"
        rotation="0 0 0"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    // ── DOM refs ──────────────────────────────────────────────
    const splashScreen    = document.getElementById('splash-screen');
    const startBtn        = document.getElementById('start-btn');
    const readMeBtn       = document.getElementById('read-me-btn');
    const guideOverlay    = document.getElementById('guide-overlay');
    const guideClose      = document.getElementById('guide-close');
    const loadingInd      = document.getElementById('loading-indicator');
    const scanHint        = document.getElementById('scan-hint');
    const scanFrame       = document.getElementById('scan-frame');
    const arScene         = document.getElementById('ar-scene');
    const arVideo         = document.getElementById('ar-video');
    const ambientAudio    = document.getElementById('ambient-audio');
    const soundBtn        = document.getElementById('sound-btn');
    const soundIcon       = document.getElementById('sound-icon');
    const fluteBtn        = document.getElementById('flute-btn');
    const fluteOverlay    = document.getElementById('flute-overlay');
    const fluteClose      = document.getElementById('flute-close');
    const tuneMatched     = document.getElementById('tune-matched');
    const holeTaps        = document.querySelectorAll('.hole-tap');
    const fluteMusic      = document.getElementById('flute-music');
    const blowInstruction = document.getElementById('blow-instruction');
    const blowProgress    = document.getElementById('blow-progress');
    const progressRing    = document.getElementById('progress-ring');

    // ── Splash / AR ready ─────────────────────────────────────
    function onReady() {
      loadingInd.style.display = 'none';
      startBtn.classList.add('ready');
      readMeBtn.classList.add('ready');
    }
    arScene.addEventListener('loaded', onReady);
    setTimeout(() => { if (!startBtn.classList.contains('ready')) onReady(); }, 5000);

    startBtn.addEventListener('click', () => {
      splashScreen.style.display = 'none';
      scanHint.style.display     = 'block';
      scanFrame.style.display    = 'flex';
      try { arScene.systems['mindar-image-system'].start(); }
      catch(e) { console.error('AR start error:', e); }
    });

    // ── Caregiver guide ───────────────────────────────────────
    readMeBtn.addEventListener('click', () => guideOverlay.classList.add('visible'));
    guideClose.addEventListener('click', () => guideOverlay.classList.remove('visible'));
    guideOverlay.addEventListener('click', (e) => {
      if (e.target === guideOverlay) guideOverlay.classList.remove('visible');
    });

    // ── Sound toggle ──────────────────────────────────────────
    let soundEnabled = false;
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        ambientAudio.play().catch(() => {});
        soundIcon.src = 'sound-on.png';
        soundIcon.alt = 'Sound on';
      } else {
        ambientAudio.pause();
        soundIcon.src = 'sound-off.png';
        soundIcon.alt = 'Sound off';
      }
    });

    // ── AR target events ──────────────────────────────────────
    arScene.addEventListener('targetFound', () => {
      scanHint.style.display  = 'none';
      scanFrame.style.display = 'none';
      soundBtn.style.display  = 'block';
      fluteBtn.style.display  = 'block';
      arVideo.play().catch(() => {});
      if (soundEnabled) ambientAudio.play().catch(() => {});
    });

    arScene.addEventListener('targetLost', () => {
      scanHint.style.display  = 'block';
      scanFrame.style.display = 'flex';
      fluteBtn.style.display  = 'none';
      fluteOverlay.classList.remove('visible');
      stopListening();
      arVideo.pause();
      ambientAudio.pause();
    });

    // ── Hole positioning ──────────────────────────────────────
    const holePositions = [
      { top: 0.31, left: 0.50 },  // hole 1
      { top: 0.38, left: 0.50 },  // hole 2
      { top: 0.46, left: 0.50 },  // hole 3
      { top: 0.53, left: 0.50 },  // hole 4
      { top: 0.61, left: 0.50 },  // hole 5
      { top: 0.69, left: 0.50 },  // hole 6
    ];

    function positionHoles() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      holeTaps.forEach((el, i) => {
        const pos = holePositions[i];
        el.style.left = (pos.left * W - 26) + 'px';
        el.style.top  = (pos.top  * H - 26) + 'px';
      });
    }
    window.addEventListener('resize', () => {
      if (fluteOverlay.classList.contains('visible')) positionHoles();
    });

    // ── Flute open / close ────────────────────────────────────
    fluteBtn.addEventListener('click', () => {
      positionHoles();
      fluteOverlay.classList.add('visible');
      resetBlow();
      startListening();
    });

    fluteClose.addEventListener('click', () => {
      fluteOverlay.classList.remove('visible');
      stopListening();
      resetBlow();
    });

    // ── Blow detection via microphone ─────────────────────────
    // Uses Web Audio API AnalyserNode to measure volume in real time.
    // A "blow" is detected when RMS volume exceeds BLOW_THRESHOLD.
    // Child must sustain the blow for BLOW_DURATION_MS milliseconds.
    // Holes light up golden while blowing; ring fills as timer progresses.

    const BLOW_THRESHOLD   = 0.015;   // RMS volume threshold (0–1). Tune if needed.
    const BLOW_DURATION_MS = 2500;   // 2.5 seconds sustained blow to trigger
    const RING_CIRCUMFERENCE = 138.2; // 2π × r(22)

    let audioCtx      = null;
    let analyser      = null;
    let micStream     = null;
    let animFrame     = null;
    let blowStartTime = null;
    let isBlowing     = false;
    let completed     = false;

    function getAudioCtx() {
      if (!audioCtx || audioCtx.state === 'closed') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    async function startListening() {
      completed = false;
      try {
        const ctx = getAudioCtx();
        if (ctx.state === 'suspended') await ctx.resume();

        micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const source = ctx.createMediaStreamSource(micStream);

        analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.4;
        source.connect(analyser);

        listenLoop();
      } catch(e) {
        // Mic permission denied — silent fail, flute still shows
        console.warn('Mic not available:', e);
      }
    }

    function stopListening() {
      if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      analyser = null;
      blowStartTime = null;
      isBlowing = false;
    }

    function listenLoop() {
      if (!analyser || completed) return;
      animFrame = requestAnimationFrame(listenLoop);

      // Compute RMS volume
      const dataArray = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(dataArray);
      let rms = 0;
      for (let i = 0; i < dataArray.length; i++) rms += dataArray[i] * dataArray[i];
      rms = Math.sqrt(rms / dataArray.length);

      const blowing = rms > BLOW_THRESHOLD;
      const now = performance.now();

      if (blowing) {
        if (!isBlowing) {
          // Blow just started
          isBlowing = true;
          blowStartTime = now;
          lightHoles(true);
          blowInstruction.classList.add('hidden');
          blowProgress.classList.add('active');
        }

        // Update progress ring
        const elapsed = now - blowStartTime;
        const fraction = Math.min(elapsed / BLOW_DURATION_MS, 1);
        const offset = RING_CIRCUMFERENCE * (1 - fraction);
        progressRing.style.strokeDashoffset = offset;

        // Check completion
        if (elapsed >= BLOW_DURATION_MS) {
          completed = true;
          stopListening();
          onBlowComplete();
        }

      } else {
        if (isBlowing) {
          // Blow stopped before threshold — reset
          isBlowing = false;
          blowStartTime = null;
          lightHoles(false);
          blowInstruction.classList.remove('hidden');
          blowProgress.classList.remove('active');
          progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
        }
      }
    }

    function lightHoles(on) {
      holeTaps.forEach(h => {
        if (on) h.classList.add('lit');
        else h.classList.remove('lit');
      });
    }

    function resetBlow() {
      completed = false;
      isBlowing = false;
      blowStartTime = null;
      lightHoles(false);
      blowInstruction.classList.remove('hidden');
      blowProgress.classList.remove('active');
      progressRing.style.strokeDashoffset = RING_CIRCUMFERENCE;
    }

    // ── Blow complete → show completion screen + play music ───
    function onBlowComplete() {
      lightHoles(false);
      fluteOverlay.classList.remove('visible');

      fluteMusic.currentTime = 0;
      fluteMusic.play().catch(() => {});

      tuneMatched.classList.add('visible');
      setTimeout(() => {
        tuneMatched.classList.remove('visible');
        fluteMusic.pause();
        fluteMusic.currentTime = 0;
        resetBlow();
      }, 2500);
    }

  </script>
</body>
</html>
